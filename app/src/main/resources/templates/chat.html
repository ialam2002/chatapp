<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messaging App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        .app-shell {
            min-height: 86vh;
        }

        #messages {
            height: 46vh;
            overflow-y: auto;
            background: #f8f9fa;
        }

        .list-panel {
            height: 28vh;
            overflow-y: auto;
        }

        .small-muted {
            font-size: 0.8rem;
            color: #6c757d;
        }
    </style>
</head>
<body class="bg-body-tertiary">
    <div class="container py-4 app-shell">
        <h1 class="mb-3">Messaging App MVP</h1>

        <div id="alertBox" class="alert alert-info d-none" role="alert"></div>

        <div id="authCard" class="card mb-3">
            <div class="card-body">
                <h2 class="h5">Sign up or login</h2>
                <div class="row g-2">
                    <div class="col-md-4">
                        <input id="username" class="form-control" placeholder="Username">
                    </div>
                    <div class="col-md-4">
                        <input id="password" type="password" class="form-control" placeholder="Password">
                    </div>
                    <div class="col-md-4 d-flex gap-2">
                        <button id="signupBtn" class="btn btn-outline-primary w-50" type="button">Sign Up</button>
                        <button id="loginBtn" class="btn btn-primary w-50" type="button">Login</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="appPanel" class="row g-3 d-none">
            <div class="col-lg-4">
                <div class="card mb-3">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="fw-semibold">Session</span>
                            <span id="connectionStatus" class="badge text-bg-secondary">Disconnected</span>
                        </div>
                        <div class="small-muted">Logged in as: <span id="currentUserLabel">-</span></div>
                    </div>
                </div>

                <div class="card mb-3">
                    <div class="card-body">
                        <h3 class="h6">Add Contact</h3>
                        <div class="input-group">
                            <input id="contactUsername" class="form-control" placeholder="Contact username">
                            <button id="addContactBtn" class="btn btn-outline-secondary" type="button">Add</button>
                        </div>
                    </div>
                </div>

                <div class="card mb-3">
                    <div class="card-body">
                        <h3 class="h6">Create Conversation</h3>
                        <input id="conversationTitle" class="form-control mb-2" placeholder="Conversation title">
                        <select id="memberSelect" class="form-select mb-2" multiple size="5"></select>
                        <button id="createConversationBtn" class="btn btn-outline-primary w-100" type="button">Create</button>
                    </div>
                </div>

                <div class="card">
                    <div class="card-body">
                        <h3 class="h6">Notifications</h3>
                        <ul id="notificationList" class="list-group list-panel"></ul>
                    </div>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="card mb-3">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <h2 class="h5 mb-0">Recent Chats</h2>
                            <span id="activeConversationLabel" class="small-muted">No conversation selected</span>
                        </div>
                        <ul id="recentChats" class="list-group mt-3"></ul>
                    </div>
                </div>

                <div class="card">
                    <div class="card-body">
                        <h2 class="h5">Messages</h2>
                        <div id="messages" class="border rounded p-3 mb-3" role="log" aria-live="polite" aria-relevant="additions"></div>

                        <div class="input-group">
                            <input id="messageInput" class="form-control" placeholder="Type your message..." autocomplete="off" disabled>
                            <button id="sendButton" class="btn btn-primary" type="button" disabled>Send</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let stompClient = null;
        let connected = false;
        let activeConversationId = null;
        let activeConversationSubscription = null;
        let reconnectTimer = null;

        const alertBox = document.getElementById('alertBox');
        const authCard = document.getElementById('authCard');
        const appPanel = document.getElementById('appPanel');
        const connectionStatus = document.getElementById('connectionStatus');
        const currentUserLabel = document.getElementById('currentUserLabel');
        const activeConversationLabel = document.getElementById('activeConversationLabel');
        const recentChats = document.getElementById('recentChats');
        const messages = document.getElementById('messages');
        const notificationList = document.getElementById('notificationList');
        const memberSelect = document.getElementById('memberSelect');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');

        function showAlert(message, type = 'info') {
            alertBox.className = `alert alert-${type}`;
            alertBox.textContent = message;
            alertBox.classList.remove('d-none');
            setTimeout(() => alertBox.classList.add('d-none'), 3000);
        }

        function updateConnectionState(isConnected, textOverride) {
            connected = isConnected;
            const text = textOverride || (isConnected ? 'Connected' : 'Disconnected');
            connectionStatus.textContent = text;
            connectionStatus.className = isConnected ? 'badge text-bg-success' : 'badge text-bg-secondary';
            syncMessageControls();
        }

        function syncMessageControls() {
            const enabled = Boolean(currentUser && connected && activeConversationId);
            messageInput.disabled = !enabled;
            sendButton.disabled = !enabled;
        }

        async function request(url, options = {}) {
            const response = await fetch(url, {
                headers: { 'Content-Type': 'application/json' },
                ...options
            });

            if (!response.ok) {
                const text = await response.text();
                throw new Error(text || `Request failed: ${response.status}`);
            }

            if (response.status === 204) {
                return null;
            }

            const text = await response.text();
            return text ? JSON.parse(text) : null;
        }

        async function signup() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const user = await request('/api/auth/signup', {
                method: 'POST',
                body: JSON.stringify({ username, password })
            });
            showAlert(`User created: ${user.username}`, 'success');
        }

        async function login() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            currentUser = await request('/api/auth/login', {
                method: 'POST',
                body: JSON.stringify({ username, password })
            });

            authCard.classList.add('d-none');
            appPanel.classList.remove('d-none');
            currentUserLabel.textContent = `${currentUser.username} (#${currentUser.id})`;

            await loadContacts();
            await loadRecentChats();
            await loadNotifications();
            connectSocket();
            showAlert(`Welcome ${currentUser.username}`, 'success');
        }

        function connectSocket() {
            if (!currentUser) {
                return;
            }

            const socket = new SockJS('/chat');
            stompClient = Stomp.over(socket);
            stompClient.debug = null;

            updateConnectionState(false, 'Connecting');

            stompClient.connect({}, function () {
                updateConnectionState(true);
                syncMessageControls();
            }, function () {
                updateConnectionState(false, 'Disconnected');
                if (reconnectTimer) {
                    clearTimeout(reconnectTimer);
                }
                reconnectTimer = setTimeout(connectSocket, 2000);
            });
        }

        async function loadContacts() {
            if (!currentUser) {
                return;
            }
            const contacts = await request(`/api/users/${currentUser.id}/contacts`);
            memberSelect.innerHTML = '';
            contacts.forEach(c => {
                const option = document.createElement('option');
                option.value = c.id;
                option.textContent = `${c.username} (#${c.id})`;
                memberSelect.appendChild(option);
            });
        }

        async function addContact() {
            const contactUsername = document.getElementById('contactUsername').value.trim();
            if (!contactUsername || !currentUser) {
                return;
            }
            await request('/api/contacts/add', {
                method: 'POST',
                body: JSON.stringify({ ownerId: currentUser.id, contactUsername })
            });
            document.getElementById('contactUsername').value = '';
            await loadContacts();
            showAlert('Contact added', 'success');
        }

        async function createConversation() {
            if (!currentUser) {
                return;
            }

            const title = document.getElementById('conversationTitle').value.trim() || 'Untitled Chat';
            const memberIds = Array.from(memberSelect.selectedOptions).map(o => Number(o.value));

            const conversation = await request('/api/conversations/create', {
                method: 'POST',
                body: JSON.stringify({
                    creatorId: currentUser.id,
                    title,
                    memberIds
                })
            });

            document.getElementById('conversationTitle').value = '';
            await loadRecentChats();
            await openConversation(conversation.id, conversation.title);
            showAlert('Conversation created', 'success');
        }

        async function loadRecentChats() {
            if (!currentUser) {
                return;
            }

            const chats = await request(`/api/users/${currentUser.id}/recent-chats`);
            recentChats.innerHTML = '';

            if (!chats.length) {
                const li = document.createElement('li');
                li.className = 'list-group-item text-muted';
                li.textContent = 'No chats yet';
                recentChats.appendChild(li);
                return;
            }

            chats.forEach(chat => {
                const li = document.createElement('li');
                li.className = 'list-group-item d-flex justify-content-between align-items-start';
                const left = document.createElement('div');
                left.innerHTML = `<div class="fw-semibold">${chat.title}</div><div class="small-muted">${chat.lastMessage}</div>`;
                const openBtn = document.createElement('button');
                openBtn.type = 'button';
                openBtn.className = 'btn btn-sm btn-outline-primary';
                openBtn.textContent = `Open${chat.unreadCount ? ` (${chat.unreadCount})` : ''}`;
                openBtn.addEventListener('click', () => openConversation(chat.conversationId, chat.title));
                li.appendChild(left);
                li.appendChild(openBtn);
                recentChats.appendChild(li);
            });
        }

        async function openConversation(conversationId, title) {
            activeConversationId = conversationId;
            activeConversationLabel.textContent = `${title} (#${conversationId})`;
            syncMessageControls();

            const chatHistory = await request(`/api/conversations/${conversationId}/messages?userId=${currentUser.id}`);
            renderMessages(chatHistory);
            subscribeToActiveConversation();
        }

        function subscribeToActiveConversation() {
            if (!stompClient || !connected || !activeConversationId) {
                return;
            }

            if (activeConversationSubscription) {
                activeConversationSubscription.unsubscribe();
                activeConversationSubscription = null;
            }

            activeConversationSubscription = stompClient.subscribe(
                `/topic/conversations/${activeConversationId}`,
                function (frame) {
                    const message = JSON.parse(frame.body);
                    appendMessage(message);
                    loadRecentChats();
                    loadNotifications();
                }
            );
        }

        function renderMessages(chatHistory) {
            messages.innerHTML = '';
            chatHistory.forEach(appendMessage);
            messages.scrollTop = messages.scrollHeight;
        }

        function appendMessage(message) {
            const messageEl = document.createElement('div');
            const sentTime = message.sentAt ? new Date(message.sentAt).toLocaleTimeString() : '';
            messageEl.className = 'mb-2 p-2 border rounded bg-white';
            messageEl.innerHTML = `<div class="fw-semibold">${message.senderUsername} <span class="small-muted">${sentTime}</span></div><div>${message.content}</div>`;
            messages.appendChild(messageEl);
            messages.scrollTop = messages.scrollHeight;
        }

        async function sendMessage() {
            const content = messageInput.value.trim();

            if (!content) {
                return;
            }

            if (!connected || !stompClient || !stompClient.connected || !activeConversationId || !currentUser) {
                showAlert('You must be connected and inside a conversation to send messages.', 'warning');
                return;
            }

            stompClient.send('/app/chat.send', {}, JSON.stringify({
                conversationId: activeConversationId,
                senderId: currentUser.id,
                content
            }));

            messageInput.value = '';
            messageInput.focus();
        }

        async function loadNotifications() {
            if (!currentUser) {
                return;
            }

            const notifications = await request(`/api/users/${currentUser.id}/notifications`);
            notificationList.innerHTML = '';

            if (!notifications.length) {
                const item = document.createElement('li');
                item.className = 'list-group-item text-muted';
                item.textContent = 'No notifications';
                notificationList.appendChild(item);
                return;
            }

            notifications.forEach(n => {
                const item = document.createElement('li');
                item.className = `list-group-item d-flex justify-content-between align-items-start ${n.readFlag ? '' : 'list-group-item-warning'}`;
                const text = document.createElement('div');
                text.innerHTML = `<div>${n.content}</div><div class="small-muted">${new Date(n.createdAt).toLocaleString()}</div>`;

                const markRead = document.createElement('button');
                markRead.type = 'button';
                markRead.className = 'btn btn-sm btn-outline-secondary';
                markRead.textContent = 'Read';
                markRead.disabled = n.readFlag;
                markRead.addEventListener('click', async () => {
                    await request(`/api/notifications/${n.id}/read?userId=${currentUser.id}`, { method: 'POST' });
                    await loadNotifications();
                    await loadRecentChats();
                });

                item.appendChild(text);
                item.appendChild(markRead);
                notificationList.appendChild(item);
            });
        }

        document.getElementById('signupBtn').addEventListener('click', async () => {
            try {
                await signup();
            } catch (error) {
                showAlert(error.message, 'danger');
            }
        });

        document.getElementById('loginBtn').addEventListener('click', async () => {
            try {
                await login();
            } catch (error) {
                showAlert(error.message, 'danger');
            }
        });

        document.getElementById('addContactBtn').addEventListener('click', async () => {
            try {
                await addContact();
            } catch (error) {
                showAlert(error.message, 'danger');
            }
        });

        document.getElementById('createConversationBtn').addEventListener('click', async () => {
            try {
                await createConversation();
            } catch (error) {
                showAlert(error.message, 'danger');
            }
        });

        sendButton.addEventListener('click', sendMessage);
        messageInput.addEventListener('keydown', function (event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
