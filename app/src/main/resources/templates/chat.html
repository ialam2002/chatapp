<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body>
    <div class="container mt-4">
        <h1 class="text-center mb-3">Real-Time Chat Application</h1>

        <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="fw-semibold">Status</span>
            <span id="connectionStatus" class="badge text-bg-secondary">Disconnected</span>
        </div>

        <div id="chat" class="border rounded p-3 mb-3 bg-light" style="height: 300px; overflow-y: auto;"></div>

        <div class="input-group mb-3">
            <input type="text" id="messageInput" class="form-control" placeholder="Type your message..." autocomplete="off">
            <button id="sendButton" class="btn btn-primary" type="button" disabled>Send</button>
        </div>
    </div>

    <script>
        let stompClient = null;
        let connected = false;

        const chatBox = document.getElementById('chat');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const connectionStatus = document.getElementById('connectionStatus');

        function updateConnectionState(isConnected) {
            connected = isConnected;
            sendButton.disabled = !isConnected;
            connectionStatus.textContent = isConnected ? 'Connected' : 'Disconnected';
            connectionStatus.className = isConnected ? 'badge text-bg-success' : 'badge text-bg-secondary';
        }

        function appendMessage(message) {
            const messageElement = document.createElement('div');
            messageElement.className = 'mb-2';
            messageElement.textContent = `${message.sender || 'Anonymous'}: ${message.content || ''}`;
            chatBox.appendChild(messageElement);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function connect() {
            const socket = new SockJS('/chat');
            stompClient = Stomp.over(socket);
            stompClient.debug = null;

            stompClient.connect({}, function () {
                updateConnectionState(true);
                stompClient.subscribe('/topic/messages', function (response) {
                    appendMessage(JSON.parse(response.body));
                });
            }, function () {
                updateConnectionState(false);
                setTimeout(connect, 2000);
            });
        }

        function sendMessage() {
            const messageContent = messageInput.value.trim();

            if (!connected || !stompClient || !stompClient.connected) {
                connectionStatus.textContent = 'Disconnected - cannot send';
                connectionStatus.className = 'badge text-bg-warning';
                return;
            }

            if (!messageContent) {
                return;
            }

            stompClient.send('/app/sendmessage', {}, JSON.stringify({
                sender: 'User',
                content: messageContent
            }));

            messageInput.value = '';
            messageInput.focus();
        }

        sendButton.addEventListener('click', sendMessage);
        messageInput.addEventListener('keydown', function (event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        });

        connect();
    </script>
</body>
</html>
